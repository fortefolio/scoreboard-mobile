appId: dev.goncaloforte.scoreboard
---
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible:
      id: "topbar-avatar-btn"
    timeout: 30000

# ==========================================
# PART 1: TOURNAMENT CREATION & MANAGEMENT
# ==========================================

# 1. Open avatar dropdown menu
- tapOn:
    id: "topbar-avatar-btn"

# 2. Tap My Tournaments
- assertVisible:
    id: "menu-my-tournaments-btn"
- tapOn:
    id: "menu-my-tournaments-btn"

# 3. Assert navigated to My Tournaments
- assertVisible: ".*Tournaments.*"
- assertVisible:
    id: "header-create-tournament-btn"

# 4. Tap Create Tournament Button
- tapOn:
    id: "header-create-tournament-btn"

# 5. Assert Create Modal opened
- assertVisible:
    id: "tournament-name-input"

# 6. Fill tournament details
- tapOn:
    id: "tournament-name-input"
- inputText: "Torneio Maestro E2E"

- tapOn:
    id: "tournament-sport-dropdown-trigger"
- tapOn:
    id: "sport-select-padel"

- tapOn:
    id: "tournament-format-dropdown-trigger"
- tapOn:
    id: "stage-select-bracket"

# 7. Submit tournament creation
- tapOn:
    id: "submit-create-btn"

# 8. Confirm feedback modal
- extendedWaitUntil:
    visible:
      id: "success-modal-confirm-btn"
    timeout: 10000
- tapOn:
    id: "success-modal-confirm-btn"

# 9. Wait for tournament details screen to load
- extendedWaitUntil:
    visible: "Torneio Maestro E2E"
    timeout: 10000

# 10. CLEANUP TOURNAMENT: Delete created tournament
- tapOn:
    id: "organizer-settings-btn"
- scrollUntilVisible:
    element:
      id: "settings-delete-tournament-btn"
    direction: DOWN
- tapOn:
    id: "settings-delete-tournament-btn"

- tapOn:
    id: "android:id/button1"
    optional: true
- tapOn:
    text: ".*(Eliminar|Delete).*"
    optional: true
- tapOn:
    text: "OK"
    optional: true

# ==============================================================
# PART 2: MATCH CREATION & SCORING BOARD ROTATION (CRASH CHECK)
# ==============================================================

# 11. Navigate to My Matches via avatar menu
- extendedWaitUntil:
    visible:
      id: "topbar-avatar-btn"
    timeout: 15000
- tapOn:
    id: "topbar-avatar-btn"

- assertVisible:
    id: "menu-my-matches-btn"
- tapOn:
    id: "menu-my-matches-btn"

# 12. Assert My Matches list
- assertVisible: ".*Matches.*"
- assertVisible:
    id: "header-create-match-btn"

# 13. Create Match
- tapOn:
    id: "header-create-match-btn"

- assertVisible:
    id: "match-team1-input"
- tapOn:
    id: "match-team1-input"
- inputText: "Benfica E2E"
- tapOn:
    id: "match-team2-input"
- inputText: "Porto E2E"

- tapOn:
    id: "match-sport-dropdown-trigger"
- tapOn:
    id: "match-sport-select-football"

- tapOn:
    id: "submit-create-match-btn"

# 14. Confirm feedback modal
- extendedWaitUntil:
    visible:
      id: "success-modal-confirm-btn"
    timeout: 10000
- tapOn:
    id: "success-modal-confirm-btn"

# 15. Wait for match to appear in Match Detail screen
- extendedWaitUntil:
    visible: "Benfica E2E"
    timeout: 10000

# 16. Open Scoreboard Console (validates orientation lock & ensures no native crash)
- assertVisible:
    id: "start-scoreboard-btn"
- tapOn:
    id: "start-scoreboard-btn"

# 17. CRITICAL ASSERTION: Assert Scoreboard opened successfully in Landscape without crash
- extendedWaitUntil:
    visible:
      id: "scoreboard-screen"
    timeout: 15000

- assertVisible:
    id: "scoreboard-back-btn"

# 18. Exit Scoreboard back to Match Detail screen (restores Portrait mode)
- tapOn:
    id: "scoreboard-back-btn"

- extendedWaitUntil:
    visible: "Benfica E2E"
    timeout: 10000

# 19. CLEANUP MATCH: Navigate back to My Matches list and delete
- tapOn:
    id: "match-detail-back-btn"

- extendedWaitUntil:
    visible: "Benfica E2E"
    timeout: 10000
- tapOn:
    id: ".*match-delete-btn.*"
- assertVisible:
    id: "confirm-delete-match-btn"
- tapOn:
    id: "confirm-delete-match-btn"

# 20. Return to home
- tapOn:
    id: "header-back-btn"
    optional: true
