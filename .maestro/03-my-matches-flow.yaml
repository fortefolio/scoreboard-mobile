appId: dev.goncaloforte.scoreboard
---
- launchApp:
    clearState: false

- assertVisible: "SCORE:BOARD"

# 1. Tap Avatar
- tapOn:
    id: "topbar-avatar-btn"

# 2. Tap My Matches
- assertVisible:
    id: "menu-my-matches-btn"
- tapOn:
    id: "menu-my-matches-btn"

# 3. Assert we navigated to My Matches (not redirected to Home)
- assertVisible: ".*Matches.*"
- assertVisible:
    id: "header-create-match-btn"

# 4. Tap Create Match Button
- tapOn:
    id: "header-create-match-btn"

# 5. Assert Create Modal opened
- assertVisible:
    id: "match-team1-input"

# 6. Fill team names
- tapOn:
    id: "match-team1-input"
- inputText: "Benfica E2E"
- tapOn:
    id: "match-team2-input"
- inputText: "Porto E2E"

# 7. Submit match creation
- tapOn:
    id: "submit-create-match-btn"

# 8. Dismiss success alert
- tapOn:
    id: "android:id/button1"
    optional: true
- tapOn:
    text: "OK"
    optional: true

# 9. Wait for match to appear
- extendedWaitUntil:
    visible: "Benfica E2E"
    timeout: 10000

# 10. Return to home
- tapOn:
    id: "header-back-btn"
    optional: true
