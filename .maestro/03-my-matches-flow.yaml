appId: dev.goncaloforte.scoreboard
---
- launchApp:
    clearState: false

- assertVisible: "SCORE:BOARD"

# 1. Tap Avatar
- tapOn:
    id: "topbar-avatar-btn"

# 2. Tap "Os Meus Jogos"
- assertVisible:
    id: "menu-my-matches-btn"
- tapOn:
    id: "menu-my-matches-btn"

# 3. Assert we navigated to My Matches (not redirected to Home)
- assertVisible: "Os Meus Jogos"
- assertVisible:
    id: "header-create-match-btn"

# 4. Tap Create Match Button
- tapOn:
    id: "header-create-match-btn"

# 5. Assert Create Modal opened
- assertVisible:
    id: "match-team1-input"

# 6. Fill team names
- tapOn:
    id: "match-team1-input"
- inputText: "Benfica E2E"
- tapOn:
    id: "match-team2-input"
- inputText: "Porto E2E"
- back

# 7. Submit match creation
- tapOn:
    id: "submit-create-match-btn"

# 8. Wait for match to appear
- extendedWaitUntil:
    visible: "Benfica E2E"
    timeout: 10000

# 9. Return to home
- tapOn:
    id: "header-back-btn"
    optional: true
