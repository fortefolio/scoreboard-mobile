appId: dev.goncaloforte.scoreboard
---
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible:
      id: "topbar-avatar-btn"
    timeout: 30000

# 1. Tap Avatar
- tapOn:
    id: "topbar-avatar-btn"

# 2. Tap My Matches
- assertVisible:
    id: "menu-my-matches-btn"
- tapOn:
    id: "menu-my-matches-btn"

# 3. Assert we navigated to My Matches (not redirected to Home)
- assertVisible: ".*Matches.*"
- assertVisible:
    id: "header-create-match-btn"

# 4. Tap Create Match Button
- tapOn:
    id: "header-create-match-btn"

# 5. Assert Create Modal opened
- assertVisible:
    id: "match-team1-input"

# 6. Fill team names
- tapOn:
    id: "match-team1-input"
- inputText: "Benfica E2E"
- tapOn:
    id: "match-team2-input"
- inputText: "Porto E2E"

# 7. Select sport from Dropdown
- tapOn:
    id: "match-sport-dropdown-trigger"
- tapOn:
    id: "match-sport-select-football"

# 8. Submit match creation
- tapOn:
    id: "submit-create-match-btn"

# 9. Confirm sleek FeedbackModal
- extendedWaitUntil:
    visible:
      id: "success-modal-confirm-btn"
    timeout: 10000
- tapOn:
    id: "success-modal-confirm-btn"

# 10. Wait for match to appear in Match Detail screen
- extendedWaitUntil:
    visible: "Benfica E2E"
    timeout: 10000

# 11. Navigate back to My Matches list to test deletion
- tapOn:
    id: "match-detail-back-btn"

# 12. CLEANUP: Delete created match from My Matches list
- extendedWaitUntil:
    visible: "Benfica E2E"
    timeout: 10000
- tapOn:
    id: ".*match-delete-btn.*"
- assertVisible:
    id: "confirm-delete-match-btn"
- tapOn:
    id: "confirm-delete-match-btn"

# 13. Return to home
- tapOn:
    id: "header-back-btn"
    optional: true
