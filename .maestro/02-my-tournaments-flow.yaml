appId: dev.goncaloforte.scoreboard
---
- launchApp:
    clearState: false

- assertVisible: "SCORE:BOARD"

# 1. Tap Avatar
- tapOn:
    id: "topbar-avatar-btn"

# 2. Tap My Tournaments
- assertVisible:
    id: "menu-my-tournaments-btn"
- tapOn:
    id: "menu-my-tournaments-btn"

# 3. Assert we navigated to My Tournaments (not redirected to Home)
- assertVisible: ".*Tournaments.*"
- assertVisible:
    id: "header-create-tournament-btn"

# 4. Tap Create Tournament Button
- tapOn:
    id: "header-create-tournament-btn"

# 5. Assert Create Modal opened (PRO tier validated)
- assertVisible:
    id: "tournament-name-input"

# 6. Fill tournament name
- tapOn:
    id: "tournament-name-input"
- inputText: "Torneio Maestro E2E"

# 7. Submit tournament creation
- tapOn:
    id: "submit-create-btn"

# 8. Dismiss success alert
- tapOn:
    id: "android:id/button1"
    optional: true
- tapOn:
    text: "OK"
    optional: true

# 9. Wait for tournament details screen to load with name
- extendedWaitUntil:
    visible: "Torneio Maestro E2E"
    timeout: 10000

# 10. Return to home
- tapOn:
    id: "header-back-btn"
    optional: true
