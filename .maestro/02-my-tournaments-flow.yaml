appId: dev.goncaloforte.scoreboard
---
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible:
      id: "topbar-avatar-btn"
    timeout: 30000

# 1. Tap Avatar
- tapOn:
    id: "topbar-avatar-btn"

# 2. Tap My Tournaments
- assertVisible:
    id: "menu-my-tournaments-btn"
- tapOn:
    id: "menu-my-tournaments-btn"

# 3. Assert we navigated to My Tournaments (not redirected to Home)
- assertVisible: ".*Tournaments.*"
- assertVisible:
    id: "header-create-tournament-btn"

# 4. Tap Create Tournament Button
- tapOn:
    id: "header-create-tournament-btn"

# 5. Assert Create Modal opened (PRO tier validated)
- assertVisible:
    id: "tournament-name-input"

# 6. Fill tournament name
- tapOn:
    id: "tournament-name-input"
- inputText: "Torneio Maestro E2E"

# 7. Select sport from Dropdown
- tapOn:
    id: "tournament-sport-dropdown-trigger"
- tapOn:
    id: "sport-select-padel"

# 8. Select format from Dropdown
- tapOn:
    id: "tournament-format-dropdown-trigger"
- tapOn:
    id: "stage-select-bracket"

# 9. Submit tournament creation
- tapOn:
    id: "submit-create-btn"

# 10. Confirm sleek FeedbackModal
- extendedWaitUntil:
    visible:
      id: "success-modal-confirm-btn"
    timeout: 10000
- tapOn:
    id: "success-modal-confirm-btn"

# 11. Wait for tournament details screen to load with name
- extendedWaitUntil:
    visible: "Torneio Maestro E2E"
    timeout: 10000

# 12. CLEANUP: Delete created tournament
- tapOn:
    id: "organizer-settings-btn"
- scrollUntilVisible:
    element:
      id: "settings-delete-tournament-btn"
    direction: DOWN
- tapOn:
    id: "settings-delete-tournament-btn"

# Confirm native alert dialog deletion
- tapOn:
    id: "android:id/button1"
    optional: true
- tapOn:
    text: ".*(Eliminar|Delete).*"
    optional: true
- tapOn:
    text: "OK"
    optional: true

# 13. Return to home
- tapOn:
    id: "header-back-btn"
    optional: true
