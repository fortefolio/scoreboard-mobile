appId: dev.goncaloforte.scoreboard
---
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible:
      text: "SCORE:BOARD"
    timeout: 30000

# If not logged in, perform login with local test credentials
- runFlow:
    when:
      visible:
        id: "topbar-signin-btn"
    commands:
      - tapOn:
          id: "topbar-signin-btn"
      - assertVisible:
          id: "auth-email-input"
      - tapOn:
          id: "auth-email-input"
      - inputText: "e2e-test@scoreboard.local"
      - tapOn:
          id: "auth-password-input"
      - inputText: "E2eTestPass123!"
      - tapOn: "SCORE:BOARD"
      - tapOn:
          id: "auth-submit-btn"

# Assert login succeeded and hamburger menu button is visible
- extendedWaitUntil:
    visible:
      id: "topbar-avatar-btn"
    timeout: 10000
- tapOn:
    id: "topbar-avatar-btn"
- assertVisible:
    id: "menu-settings-btn"
- assertVisible:
    id: "menu-my-matches-btn"
- assertVisible:
    id: "menu-logout-btn"
- tapOn:
    point: "20%,50%"
